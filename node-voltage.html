<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>节点电压法 · 交互式探究</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif; background: #f4f7f6; color: #2c3e50; padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .id-badge { background: #e74c3c; color: white; padding: 6px 20px; border-radius: 25px; font-size: 16px; display: inline-block; margin-bottom: 15px; font-weight: bold; box-shadow: 0 4px 10px rgba(231,76,60,0.3);}
        h1 { margin: 0 0 10px 0; font-size: 28px; letter-spacing: 2px;}

        /* 整体布局 */
        .container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; }
        .top-section { display: flex; gap: 20px; width: 100%; }
        .panel { background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); padding: 20px; }
        
        /* 左侧电路图 */
        .circuit-area { flex: 1.2; display: flex; justify-content: center; align-items: center; min-width: 600px; }
        .circuit-svg { width: 100%; max-width: 650px; height: auto; }
        
        /* 右侧控制区 */
        .control-area { flex: 0.8; display: flex; flex-direction: column; gap: 15px; min-width: 450px; }
        
        /* 右侧 POE 预测 */
        .poe-box { background: #fff8f8; border: 2px solid #e74c3c; border-radius: 10px; padding: 15px; text-align: left;}
        .poe-box h3 { margin: 0 0 10px 0; color: #e74c3c; font-size: 18px; }
        .poe-box p { font-size: 15px; line-height: 1.6; margin: 5px 0;}
        .poe-input-group { display: flex; gap: 10px; margin-top: 10px;}
        .poe-input-group input { flex: 1; padding: 8px; font-size: 18px; border: 2px solid #3498db; border-radius: 6px; outline: none;}
        .poe-input-group button { padding: 8px 20px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .poe-input-group button:hover { background: #2980b9; }
        .poe-input-group button:disabled { background: #bdc3c7; cursor: not-allowed; }
        .poe-feedback { margin-top: 10px; font-size: 14px; font-weight: bold; display: none;}

        /* 滑块组 */
        .slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .slider-group { display: flex; flex-direction: column; gap: 5px; background: #f8f9fa; padding: 10px; border-radius: 8px; border: 1px solid #e9ecef; }
        .slider-group label { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; color: #34495e;}
        .slider-group input[type=range] { width: 100%; cursor: pointer; accent-color: #3498db; }

        /* 底部方程区 */
        .equation-area { width: 100%; background: #1e1e2f; color: #fff; padding: 20px; border-radius: 12px; font-family: 'Courier New', monospace; font-size: 18px; line-height: 1.8; border-left: 6px solid #f1c40f; text-align: left; overflow-x: auto;}
        .rule-text { color: #e74c3c; font-weight: bold; font-size: 18px; margin-bottom: 15px; border-bottom: 1px dashed #555; padding-bottom: 10px;}
        
        /* 动态高亮样式（强效闪烁） */
        .eq-term { color: #abb2bf; transition: all 0.2s; padding: 0 4px; border-radius: 4px; display: inline-block;}
        
        @keyframes flash-bg {
            0% { background-color: #f1c40f; color: #1e1e2f; transform: scale(1.15); box-shadow: 0 0 15px #f1c40f; }
            100% { background-color: transparent; color: inherit; transform: scale(1); box-shadow: none; }
        }
        .flash-update { animation: flash-bg 0.8s ease-out; }
    </style>
</head>
<body>

    <div class="id-badge">个人专属ID: <span id="antiCheatID">生成中...</span></div>
    <h1>⚡ 节点电压法 · 矩阵重组探究</h1>

    <div class="container">
        <div class="top-section">
            <!-- 左侧 SVG 电路图 -->
            <div class="panel circuit-area">
                <svg class="circuit-svg" viewBox="0 0 650 550" xmlns="http://www.w3.org/2000/svg">
                    <style>
                        .wire { stroke: #2c3e50; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
                        .node { fill: #e74c3c; }
                        .node-text { fill: #2c3e50; font-size: 18px; font-weight: bold; font-family: 'Microsoft YaHei'; }
                        .comp-text { fill: #34495e; font-size: 16px; font-weight: bold; font-family: 'Microsoft YaHei'; }
                        .val-text { fill: #e74c3c; font-size: 16px; font-weight: bold; font-family: 'Microsoft YaHei'; }
                        .label-text { fill: #2980b9; font-size: 14px; font-weight: bold; font-family: 'Microsoft YaHei'; }
                    </style>

                    <!-- 连线：节点①到节点② -->
                    <path d="M 180 250 L 300 250" class="wire"/>
                    <path d="M 340 250 L 480 250" class="wire"/>
                    
                    <!-- 节点①向下支路 (V1 + R1) -->
                    <path d="M 180 250 L 180 300" class="wire"/>
                    <path d="M 180 340 L 180 380" class="wire"/>
                    <path d="M 180 420 L 180 480" class="wire"/>
                    <path d="M 180 480 L 480 480" class="wire"/>
                    <path d="M 180 480 L 180 510" class="wire"/>
                    
                    <!-- 节点①向上支路 (Is1 + R3) 完美水平对齐 -->
                    <path d="M 180 250 L 180 120 L 208 120" class="wire"/>
                    <path d="M 252 120 L 300 120" class="wire"/>
                    <path d="M 340 120 L 480 120 L 480 250" class="wire"/>

                    <!-- 节点②向下支路 (R4) -->
                    <path d="M 480 250 L 480 300" class="wire"/>
                    <path d="M 480 340 L 480 480" class="wire"/>
                    <path d="M 480 480 L 480 510" class="wire"/>
                    
                    <!-- 节点②向右支路 (Is2) -->
                    <path d="M 480 250 L 580 250 L 580 370" class="wire"/>
                    <path d="M 580 410 L 580 480 L 480 480" class="wire"/>
                    
                    <!-- 接地符号 -->
                    <path d="M 150 510 L 210 510" class="wire" stroke-width="5"/>
                    <path d="M 450 510 L 510 510" class="wire" stroke-width="5"/>

                    <!-- 元件 -->
                    <!-- 支路1: V1 电压源 (180, 400) -->
                    <circle cx="180" cy="400" r="22" fill="white" stroke="#2c3e50" stroke-width="3"/>
                    <line x1="165" y1="390" x2="195" y2="390" stroke="#e74c3c" stroke-width="4"/>
                    <line x1="173" y1="410" x2="187" y2="410" stroke="#2c3e50" stroke-width="4"/>
                    <text x="215" y="405" class="val-text" id="svgV1Text">12V</text>
                    <text x="140" y="405" class="label-text">V1</text>
                    <text x="150" y="390" class="comp-text">+</text>
                    <text x="150" y="420" class="comp-text">-</text>

                    <!-- 支路1: R1 电阻 (180, 320) -->
                    <rect x="165" y="300" width="30" height="40" fill="white" stroke="#2980b9" stroke-width="3"/>
                    <text x="215" y="325" class="val-text" id="svgR1Text">5Ω</text>
                    <text x="215" y="305" class="label-text">R1</text>

                    <!-- 支路2: Is1 电流源 (230, 120) —— 水平支路，横线垂直 -->
                    <circle cx="230" cy="120" r="22" fill="white" stroke="#2c3e50" stroke-width="3"/>
                    <line x1="230" y1="105" x2="230" y2="135" stroke="#2c3e50" stroke-width="3"/>
                    <!-- 外部箭头 (向右) -->
                    <path d="M 252 120 L 275 120" stroke="#e74c3c" stroke-width="4" id="svgIs1Path"/>
                    <polygon points="275,115 285,120 275,125" fill="#e74c3c" id="svgIs1Arrow"/>
                    <text x="200" y="100" class="label-text">Is1</text>
                    <text x="215" y="150" class="val-text" id="svgIs1Text">5.5A</text>

                    <!-- 支路2: R3 电阻 (320, 120) -->
                    <rect x="300" y="105" width="40" height="30" fill="white" stroke="#2980b9" stroke-width="3"/>
                    <text x="310" y="160" class="val-text" id="svgR3Text">4Ω</text>
                    <text x="310" y="95" class="label-text">R3</text>

                    <!-- 支路3: R2 电阻 (320, 250) -->
                    <rect x="300" y="235" width="40" height="30" fill="white" stroke="#2980b9" stroke-width="3"/>
                    <text x="310" y="290" class="val-text" id="svgR2Text">3Ω</text>
                    <text x="310" y="225" class="label-text">R2</text>

                    <!-- 支路4: R4 电阻 (480, 320) -->
                    <rect x="465" y="300" width="30" height="40" fill="white" stroke="#2980b9" stroke-width="3"/>
                    <text x="515" y="325" class="val-text" id="svgR4Text">1Ω</text>
                    <text x="515" y="305" class="label-text">R4</text>

                    <!-- 支路5: Is2 电流源 (580, 390) -->
                    <circle cx="580" cy="390" r="22" fill="white" stroke="#2c3e50" stroke-width="3"/>
                    <line x1="565" y1="390" x2="595" y2="390" stroke="#2c3e50" stroke-width="3"/>
                    <!-- 外部箭头 (向上) -->
                    <path d="M 580 370 L 580 340" stroke="#e74c3c" stroke-width="4" id="svgIs2Path"/>
                    <polygon points="575,340 580,330 585,340" fill="#e74c3c" id="svgIs2Arrow"/>
                    <text x="615" y="385" class="label-text">Is2</text>
                    <text x="615" y="405" class="val-text" id="svgIs2Text">2.0A</text>

                    <!-- 节点标记 -->
                    <circle cx="180" cy="250" r="7" class="node"/>
                    <text x="145" y="240" class="node-text">①</text>
                    <circle cx="480" cy="250" r="7" class="node"/>
                    <text x="505" y="240" class="node-text">②</text>
                    <text x="240" y="530" class="node-text">0 (参考节点)</text>
                </svg>
            </div>

            <!-- 右侧控制区 -->
            <div class="panel control-area">
                <div class="poe-box" id="poeBox">
                    <h3>🔒 POE预测：请先回答正确，才能解锁实验！</h3>
                    <p>仔细观察电路图，图中包含一条 <b>“电流源 Is1 串联电阻 R3”</b> 的特殊支路。</p>
                    <p style="color: #e74c3c; font-weight: bold;" id="poeQuestion">请回答：这条电流源支路对节点①的“电流贡献”是多少安培？</p>
                    <p style="font-size: 13px; color: #7f8c8d;">💡 提示：注意观察电流源箭头方向。流入节点记为正，流出节点记为负。</p>
                    <div class="poe-input-group">
                        <input type="number" id="poeInput" placeholder="输入数字">
                        <button id="poeSubmitBtn" onclick="checkPOE()">提交</button>
                    </div>
                    <div class="poe-feedback" id="poeFeedback"></div>
                </div>

                <div id="slidersContainer" style="display: none; flex-direction: column; gap: 10px;">
                    <div class="slider-grid">
                        <div class="slider-group">
                            <label>电压源 V1 <span id="v1Val">12 V</span></label>
                            <input type="range" id="v1" min="2" max="24" value="12" step="1">
                        </div>
                        <div class="slider-group">
                            <label>电流源 Is1 <span id="is1Val">5.5 A</span></label>
                            <input type="range" id="is1" min="1" max="10" value="5.5" step="0.5">
                        </div>
                    </div>
                    <div class="slider-grid">
                        <div class="slider-group">
                            <label>电阻 R1 <span id="r1Val">5 Ω</span></label>
                            <input type="range" id="r1" min="1" max="10" value="5" step="1">
                        </div>
                        <div class="slider-group">
                            <label>电阻 R2 <span id="r2Val">3 Ω</span></label>
                            <input type="range" id="r2" min="1" max="10" value="3" step="1">
                        </div>
                    </div>
                    <div class="slider-grid">
                        <div class="slider-group">
                            <label>电阻 R3 (Is1串联) <span id="r3Val">4 Ω</span></label>
                            <input type="range" id="r3" min="1" max="10" value="4" step="1">
                        </div>
                        <div class="slider-group">
                            <label>电阻 R4 <span id="r4Val">1 Ω</span></label>
                            <input type="range" id="r4" min="1" max="10" value="1" step="1">
                        </div>
                    </div>
                    <div class="slider-grid">
                        <div class="slider-group">
                            <label>电流源 Is2 <span id="is2Val">2.0 A</span></label>
                            <input type="range" id="is2" min="0.5" max="5" value="2" step="0.5">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 下半部分：方程展示区 -->
        <div class="equation-area" id="matrixBox">
            <!-- 动态渲染 -->
        </div>
    </div>

    <script>
        const randomID = 'STU-NODE-' + Math.floor(Math.random() * 9000 + 1000);
        document.getElementById('antiCheatID').textContent = randomID;

        const sliders = ['v1', 'is1', 'r1', 'r2', 'r3', 'r4', 'is2'];
        const inputs = {};
        sliders.forEach(id => { inputs[id] = document.getElementById(id); });

        let poePassed = false;
        let attemptCount = 0;
        let is1Direction = 1; // 1 表示向右(流出①流入②)，-1 表示向左(流入①流出②)
        let is2Direction = 1; // 1 表示向上(流入②)，-1 表示向下(流出②)

        function randomizeDirections() {
            is1Direction = Math.random() > 0.5 ? 1 : -1;
            is2Direction = Math.random() > 0.5 ? 1 : -1;

            const is1Arrow = document.getElementById('svgIs1Arrow');
            const is1Path = document.getElementById('svgIs1Path');
            const is2Arrow = document.getElementById('svgIs2Arrow');
            const is2Path = document.getElementById('svgIs2Path');

            if (is1Direction === 1) {
                is1Path.setAttribute('d', 'M 252 120 L 275 120');
                is1Arrow.setAttribute('points', '275,115 285,120 275,125');
                document.getElementById('poeQuestion').innerText = '请回答：这条电流源支路对节点①的“电流贡献”是多少安培？（提示：注意箭头方向，流出为负）';
            } else {
                is1Path.setAttribute('d', 'M 208 120 L 185 120');
                is1Arrow.setAttribute('points', '185,115 175,120 185,125');
                document.getElementById('poeQuestion').innerText = '请回答：这条电流源支路对节点①的“电流贡献”是多少安培？（提示：注意箭头方向，流入为正）';
            }

            if (is2Direction === 1) {
                is2Path.setAttribute('d', 'M 580 370 L 580 340');
                is2Arrow.setAttribute('points', '575,340 580,330 585,340');
            } else {
                is2Path.setAttribute('d', 'M 580 340 L 580 370');
                is2Arrow.setAttribute('points', '575,370 580,380 585,370');
            }
        }

        function checkPOE() {
            attemptCount++;
            const ans = parseFloat(document.getElementById('poeInput').value);
            const currentIs1 = parseFloat(inputs.is1.value);
            
            // 如果Is1向右（流出①），贡献为负；如果向左（流入①），贡献为正
            const correctAnswer = is1Direction === 1 ? -currentIs1 : currentIs1;

            const feedbackEl = document.getElementById('poeFeedback');
            const submitBtn = document.getElementById('poeSubmitBtn');
            feedbackEl.style.display = 'block';

            if (ans === correctAnswer) {
                poePassed = true;
                feedbackEl.style.color = '#2ecc71';
                feedbackEl.textContent = '✅ 完美！你正确分析了电流源的方向和支路贡献。';
                document.getElementById('poeBox').style.backgroundColor = '#f0fff0';
                document.getElementById('poeBox').style.borderColor = '#2ecc71';
                submitBtn.disabled = true;
                document.getElementById('slidersContainer').style.display = 'flex';
                update(null);
            } else {
                feedbackEl.style.color = '#e74c3c';
                if (ans === currentIs1 * parseFloat(inputs.r3.value) || ans === -currentIs1 * parseFloat(inputs.r3.value)) {
                    feedbackEl.textContent = '❌ 你误把串联电阻算进去了。电流源输出电流是恒定的，串联电阻不影响它流出的电流大小！';
                } else if (ans === -correctAnswer) {
                    feedbackEl.textContent = '❌ 数值对了，但方向错了！请仔细观察图中电流源箭头的方向。';
                } else {
                    feedbackEl.textContent = '❌ 答案不正确。提示：结合KCL，该支路的“电流贡献”与串联电阻有关吗？方向对吗？';
                }
                if (attemptCount >= 3) {
                    feedbackEl.textContent += ' ⚠️ 请仔细思考，等待 3 秒后再试。';
                    submitBtn.disabled = true;
                    setTimeout(() => { submitBtn.disabled = false; }, 3000);
                }
            }
        }

        function update(changedId) {
            if (!poePassed) return;

            const V1 = parseFloat(inputs.v1.value);
            const Is1 = parseFloat(inputs.is1.value);
            const R1 = parseFloat(inputs.r1.value);
            const R2 = parseFloat(inputs.r2.value);
            const R3 = parseFloat(inputs.r3.value);
            const R4 = parseFloat(inputs.r4.value);
            const Is2 = parseFloat(inputs.is2.value);

            document.getElementById('v1Val').textContent = V1 + ' V';
            document.getElementById('is1Val').textContent = Is1.toFixed(1) + ' A';
            document.getElementById('r1Val').textContent = R1 + ' Ω';
            document.getElementById('r2Val').textContent = R2 + ' Ω';
            document.getElementById('r3Val').textContent = R3 + ' Ω';
            document.getElementById('r4Val').textContent = R4 + ' Ω';
            document.getElementById('is2Val').textContent = Is2.toFixed(1) + ' A';

            document.getElementById('svgV1Text').textContent = V1 + 'V';
            document.getElementById('svgIs1Text').textContent = Is1.toFixed(1) + 'A';
            document.getElementById('svgR1Text').textContent = R1 + 'Ω';
            document.getElementById('svgR2Text').textContent = R2 + 'Ω';
            document.getElementById('svgR3Text').textContent = R3 + 'Ω';
            document.getElementById('svgR4Text').textContent = R4 + 'Ω';
            document.getElementById('svgIs2Text').textContent = Is2.toFixed(1) + 'A';

            // 统一使用“流入为正，流出为负”的规则
            // 节点①注入电流 = V1/R1 + Is1流入①
            const Is1_into_A = is1Direction === 1 ? -Is1 : Is1; // 向右是流出①，所以注入①为负
            const IsA = (V1 / R1) + Is1_into_A;

            // 节点②注入电流 = Is1流入② + Is2流入②
            const Is1_into_B = is1Direction === 1 ? Is1 : -Is1; // 向右是流入②，所以注入②为正
            const Is2_into_B = is2Direction === 1 ? Is2 : -Is2; // 向上是流入②，所以注入②为正
            const IsB = Is1_into_B + Is2_into_B;

            const G11 = (1/R1) + (1/R2);
            const G12 = -1/R2;
            const G21 = -1/R2;
            const G22 = (1/R2) + (1/R4);

            const det = G11 * G22 - G12 * G21;
            const U1 = (IsA * G22 - IsB * G12) / det;
            const U2 = (G11 * IsB - G21 * IsA) / det;

            // 构建公式字符串（精准匹配符号）
            let is1SignA = Is1_into_A >= 0 ? '+' : '-';
            let is1SignB = Is1_into_B >= 0 ? '+' : '-';
            let is2SignB = Is2_into_B >= 0 ? '+' : '-';

            let eq1_html = `
                <div class="eq-line" id="eq-node1">
                    <span style="color: #61afef;">节点①方程：</span>
                    <span class="eq-term ${changedId === 'r1' ? 'flash-update' : ''}">(1/${R1}</span> 
                    <span class="eq-term ${changedId === 'r2' ? 'flash-update' : ''}">+ 1/${R2})</span> U1 
                    <span class="eq-term ${changedId === 'r2' ? 'flash-update' : ''}">- (1/${R2})</span> U2 
                    = <span class="eq-term ${changedId === 'v1' || changedId === 'r1' ? 'flash-update' : ''}">${V1}/${R1}</span> 
                    <span class="eq-term ${changedId === 'is1' ? 'flash-update' : ''}">${is1SignA} ${Math.abs(Is1_into_A).toFixed(1)}</span>
                </div>
            `;

            let eq2_html = `
                <div class="eq-line" id="eq-node2">
                    <span style="color: #61afef;">节点②方程：</span>
                    <span class="eq-term ${changedId === 'r2' ? 'flash-update' : ''}">- (1/${R2})</span> U1 
                    <span class="eq-term ${changedId === 'r2' ? 'flash-update' : ''}">+ (1/${R2}</span> 
                    <span class="eq-term ${changedId === 'r4' ? 'flash-update' : ''}">+ 1/${R4})</span> U2 
                    = <span class="eq-term ${changedId === 'is1' ? 'flash-update' : ''}">${is1SignB} ${Math.abs(Is1_into_B).toFixed(1)}</span> 
                    <span class="eq-term ${changedId === 'is2' ? 'flash-update' : ''}">${is2SignB} ${Math.abs(Is2_into_B).toFixed(1)}</span>
                </div>
            `;

            let matrix_html = `
                <div style="margin-top: 20px; border-top: 1px dashed #555; padding-top: 20px;">
                    <div style="color: #f1c40f; font-size: 20px; margin-bottom: 15px;">📐 最终矩阵形式 (G * U = I)</div>
                    <div style="display: flex; justify-content: center; align-items: center; font-size: 24px; letter-spacing: 2px;">
                        <div style="text-align: right; margin-right: 15px;">
                            | <span class="eq-term ${changedId === 'r1' || changedId === 'r2' ? 'flash-update' : ''}">${G11.toFixed(2)}</span>  
                            <span class="eq-term ${changedId === 'r2' ? 'flash-update' : ''}">${G12.toFixed(2)}</span> |<br>
                            | <span class="eq-term ${changedId === 'r2' ? 'flash-update' : ''}">${G21.toFixed(2)}</span>  
                            <span class="eq-term ${changedId === 'r2' || changedId === 'r4' ? 'flash-update' : ''}">${G22.toFixed(2)}</span> |
                        </div>
                        <div style="text-align: center; margin-right: 15px;">
                            | U1 |<br>
                            | U2 |
                        </div>
                        <div style="text-align: center; margin-right: 15px; color: #61afef;">=</div>
                        <div style="text-align: left;">
                            | <span class="eq-term ${changedId === 'v1' || changedId === 'r1' || changedId === 'is1' ? 'flash-update' : ''}">${IsA.toFixed(2)}</span> |<br>
                            | <span class="eq-term ${changedId === 'is1' || changedId === 'is2' ? 'flash-update' : ''}">${IsB.toFixed(2)}</span> |
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('matrixBox').innerHTML = `
                <div class="rule-text">📏 规定：自导恒为正，互导恒为负。流出节点的电流之和为 0（流入为负，流出为正）</div>
                <div style="font-size: 18px; line-height: 2.5; margin-bottom: 15px;">
                    ${eq1_html}
                    ${eq2_html}
                </div>
                <div style="color: #98c379; font-weight: bold; font-size: 20px; margin-top: 15px;">
                    ✅ 求解结果: U1 = ${U1.toFixed(2)} V,  U2 = ${U2.toFixed(2)} V
                </div>
                ${matrix_html}
            `;
        }

        inputs.r3.addEventListener('input', () => {
            if (poePassed) {
                const tip = document.createElement('div');
                tip.innerHTML = '⚠️ <b>观察：</b>改变 R3 不影响电流源输出电流！<br>方程中不存在 R3，G11 纹丝不动！';
                tip.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #e74c3c; color: white; padding: 20px 40px; border-radius: 12px; font-size: 20px; font-weight: bold; z-index: 9999; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: none; opacity: 0; transition: opacity 0.3s;';
                document.body.appendChild(tip);
                setTimeout(() => { tip.style.opacity = '1'; }, 10);
                setTimeout(() => { 
                    tip.style.opacity = '0'; 
                    setTimeout(() => tip.remove(), 300); 
                }, 2000);
            }
        });

        sliders.forEach(id => {
            inputs[id].addEventListener('input', () => {
                update(id);
            });
        });

        randomizeDirections();
    </script>
</body>
</html>
