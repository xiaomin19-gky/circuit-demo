<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基尔霍夫定律 · 拓扑与方程</title>
<style>
:root{
  --bg:#f4f7f6; --panel:#ffffff; --line:#e2e8f0; --text:#2c3e50;
  --muted:#7f8c8d; --cyan:#0ea5e9; --amber:#f59e0b; --green:#10b981;
  --pink:#ec4899; --violet:#8b5cf6; --gray:#94a3b8; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:30px 20px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1600px; width:100%;}
header{display:flex;align-items:center;gap:24px;margin-bottom:28px}
.logo{width:70px;height:70px;border-radius:20px;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,#0ea5e9,#6366f1);box-shadow:0 10px 30px rgba(14,165,233,.3);color:#fff;}
h1{font-size:32px;font-weight:700;letter-spacing:.5px}
header p{color:var(--muted);font-size:18px;margin-top:8px}

.tabs{display:flex;gap:16px;margin-bottom:28px}
.tab-btn{
  flex:1; max-width:300px; padding:16px; border-radius:14px; border:2px solid var(--line);
  background:#fff; color:var(--muted); font-size:20px; font-weight:bold; cursor:pointer; transition:.2s;
}
.tab-btn.active{background:rgba(14,165,233,.15); border-color:var(--cyan); color:var(--cyan)}

.lab{display:grid;grid-template-columns:1fr 650px;gap:28px;align-items:start}
@media(max-width:1200px){.lab{grid-template-columns:1fr}}

.stage{
  background:#ffffff; border:1px solid var(--line); border-radius:24px; padding:12px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.05); position:sticky; top:24px;
}
@media(max-width:1200px){.stage { position:relative; top:0; }}
canvas{display:block;width:100%;height:680px;border-radius:16px;cursor:pointer;}

/* 右侧卡片 */
.card{
  background:#ffffff; border:1px solid var(--line); border-radius:24px; padding:28px; margin-bottom:24px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.05);
}
.card h3{font-size:26px;color:var(--cyan);margin-bottom:20px;border-bottom:3px solid rgba(14,165,233,.2);padding-bottom:14px;}

/* 导航步骤 */
.step-guide {
  background: #f8fafc; border: 2px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 20px;
}
.step-title { font-size: 22px; font-weight: bold; margin-bottom: 16px; color: var(--cyan); line-height: 1.5; }
.opts-row { display: flex; gap: 16px; }
.opt-btn {
  flex: 1; border: 2px solid var(--line); background: #fff; color: var(--text);
  padding: 18px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
}
.opt-btn:hover { background: #f1f5f9; }
.opt-btn.correct { border-color: var(--green); background: rgba(16,185,129,.1); color: var(--green); }
.opt-btn.wrong { border-color: var(--pink); background: rgba(236,72,153,.1); color: var(--pink); animation: shake .4s; }

/* 最终公式展示 */
.eq-box {
  background: #fff; border: 3px dashed var(--amber); border-radius: 16px; padding: 24px;
  font-family: ui-monospace, Consolas, monospace; font-size: 22px; line-height: 2.2;
  display: none;
}
.eq-box.show { display: block; animation: fadeIn .4s; }
.val-pos { color: var(--cyan); font-weight: bold; }
.val-neg { color: var(--pink); font-weight: bold; }

/* 物理意义结论 */
.physics-conclusion {
  margin-top: 20px; padding: 20px; background: rgba(16,185,129,.1);
  border-left: 8px solid var(--green); border-radius: 12px; font-size: 20px; font-weight: bold; color: #047857;
  line-height: 1.8;
}

/* 控制按钮组 */
.control-group {
  background: #f8fafc; padding: 20px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 20px;
}
.control-group-title { font-size: 18px; color: var(--muted); margin-bottom: 14px; font-weight: bold; }
.btn-row { display: flex; gap: 16px; }
.btn-choice {
  flex: 1; border: 2px solid var(--line); background: #fff; color: var(--text);
  padding: 14px; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s;
  display: flex; justify-content: center; align-items: center; gap: 8px;
}
.btn-choice.active { border-color: var(--cyan); background: rgba(14,165,233,.1); color: var(--cyan); }
.btn-choice.tried::after { content: "✓"; color: var(--green); font-weight: bold; font-size: 20px; }

.kv{display:flex;justify-content:space-between;font-size:20px;padding:16px 0;border-bottom:1px dashed var(--line);}
.kv span:first-child{color:var(--muted);}
.kv span:last-child{font-weight:700;}

.op-hint {
  color: var(--red) !important; font-weight: 800 !important;
}

.btn{
  border:1px solid var(--line); background:#fff; color:var(--text);
  padding:18px 24px; border-radius:14px; cursor:pointer; font-size:20px; font-weight:bold; font-family:inherit; transition:.2s; width:100%;
}
.btn:hover{background:#f1f5f9;}
textarea{
  width:100%;margin-top:18px;font-family:ui-monospace,Consolas,monospace;font-size:18px;line-height:1.8;
  background:#f8fafc;color:var(--text);border:2px solid var(--line);border-radius:14px;padding:20px;resize:vertical; display:none;
}
textarea.show{display:block;}
.warn-text {
  color: #fff; font-size:18px; font-weight: 600; margin-top: 16px; 
  display: none; line-height: 1.5; text-align: center;
  background: var(--pink); padding: 18px; border-radius: 12px;
}
.warn-text.show { display: block; animation: shake .4s; }
@keyframes fadeIn { from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⚡</div>
    <div>
      <h1>基尔霍夫定律 · 拓扑与方程映射</h1>
      <p>体验所有方向组合，看物理守恒如何转化为代数方程</p>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('kcl')">节点 KCL (电流)</button>
    <button class="tab-btn" onclick="switchTab('kvl')">回路 KVL (电压)</button>
  </div>

  <div class="lab">
    <div class="stage" id="canvas-stage">
      <canvas id="cv-kirchhoff"></canvas>
    </div>

    <div>
      <!-- KCL 面板 -->
      <div class="card" id="panel-kcl">
        <h3>节点方程推演</h3>
        <div class="step-guide" id="kcl-poe" style="display:block; border-color:var(--amber)">
          <div class="step-title" id="kcl-poe-title" style="color:var(--red)">请点击画布中的高亮箭头翻转参考方向</div>
          <div class="opts-row" id="kcl-poe-opts"></div>
        </div>
        <div class="eq-box" id="kcl-eq"></div>
        <div class="kv"><span>操作提示</span><span class="op-hint">必须体验一次翻转才能解锁报告</span></div>
      </div>

      <!-- KVL 面板 -->
      <div class="card" id="panel-kvl" style="display:none">
        <h3>回路方程推演</h3>
        
        <div class="control-group">
          <div class="control-group-title op-hint">1. 点击切换回路电流 i 的参考方向</div>
          <div class="btn-row">
            <button class="btn-choice active" id="btn-i-cw" onclick="changeKvlCurrent(1)">顺时针</button>
            <button class="btn-choice" id="btn-i-ccw" onclick="changeKvlCurrent(-1)">逆时针</button>
          </div>
        </div>

        <div class="control-group">
          <div class="control-group-title op-hint">2. 点击切换列 KVL 时的绕行方向</div>
          <div class="btn-row">
            <button class="btn-choice active" id="btn-loop-cw" onclick="changeKvlLoop(1)">顺时针绕行</button>
            <button class="btn-choice" id="btn-loop-ccw" onclick="changeKvlLoop(-1)">逆时针绕行</button>
          </div>
        </div>

        <div class="step-guide" id="kvl-step1" style="display:block; border-color:var(--amber)">
          <div class="step-title" id="kvl-step1-title">Step 1: 判定电源 Us 的符号</div>
          <div class="opts-row" id="kvl-step1-opts"></div>
        </div>

        <div class="step-guide" id="kvl-step2" style="display:none;">
          <div class="step-title" id="kvl-step2-title">Step 2: 判定电阻的符号</div>
          <div class="opts-row" id="kvl-step2-opts"></div>
        </div>

        <div class="eq-box" id="kvl-eq"></div>
      </div>

      <div class="card">
        <h3>学情与 AI 诊断</h3>
        <div class="kv"><span>KCL 翻转次数</span><span id="m-kcl-flip" style="color:var(--amber)">0 / 1</span></div>
        <div class="kv"><span>KVL 组合体验</span><span id="m-kvl-switch" style="color:var(--cyan)">0 / 4</span></div>
        
        <div style="margin-top:24px; display:flex; gap:16px;">
          <button class="btn" id="btn-build">生成学情数据</button>
          <button class="btn" id="btn-copy">一键复制</button>
        </div>
        <textarea id="report-text" rows="8" placeholder="满足条件后，生成数据发送给学习通 AI"></textarea>
        <div class="warn-text" id="warn-box"></div>
      </div>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById('cv-kirchhoff');
const ctx = cv.getContext('2d');
let W = 0, H = 0;

function resize(){
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = r.width * dpr;
  cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = r.width; H = r.height;
}
window.addEventListener('resize', resize);
resize();

const state = {
  mode: 'kcl',
  kclDirs: [1, 1, -1], 
  kclFlips: 0,
  kvlCurrentDir: 1, 
  kvlLoopDir: 1,    
  kvlStep: 0, 
  explored: { i_cw: false, i_ccw: false, loop_cw: false, loop_ccw: false },
  pendingAction: null
};

const actualDirs = [1, 1, -1]; 
const actualVals = [3, 2, 5]; 

state.explored.i_cw = true;
state.explored.loop_cw = true;
document.getElementById('btn-i-cw').classList.add('tried');
document.getElementById('btn-loop-cw').classList.add('tried');

// ================== 绘图辅助 ==================
function drawLine(x1, y1, x2, y2, color = '#cbd5e1', width = 2) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.stroke();
}
function drawArrowHead(x, y, angle, color, size = 10) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - size * Math.cos(angle - Math.PI/6), y - size * Math.sin(angle - Math.PI/6));
    ctx.lineTo(x - size * Math.cos(angle + Math.PI/6), y - size * Math.sin(angle + Math.PI/6));
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function drawCircle(x, y, r, color, fill = false) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = color; ctx.fill(); } 
    else { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); }
}
function drawResistor(x, y, w, h, name, color = '#f59e0b') {
    ctx.fillStyle = '#fff'; ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1e293b'; ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(name, x, y);
}
function drawSource(x, y) {
    const c = '#ec4899';
    drawLine(x - 24, y - 12, x + 24, y - 12, c, 6);
    drawLine(x - 12, y + 12, x + 12, y + 12, c, 6);
    ctx.fillStyle = c; ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('12V', x - 32, y + 5);
}

// ================== KCL 绘图 ==================
function drawKCL() {
    const cx = W / 2, cy = H / 2;
    drawCircle(cx, cy, 12, '#0f172a', true);
    
    const angles = [Math.PI * 0.85, Math.PI * 1.85, Math.PI * 0.5]; 

    angles.forEach((angle, i) => {
        const len = Math.min(W, H) * 0.35; 
        const ex = cx + len * Math.cos(angle);
        const ey = cy + len * Math.sin(angle);
        drawLine(cx, cy, ex, ey, '#94a3b8', 4);
        
        const dir = state.kclDirs[i];
        const color = dir === 1 ? '#ef4444' : '#0ea5e9';
        
        const ax = cx + (len * 0.6) * Math.cos(angle);
        const ay = cy + (len * 0.6) * Math.sin(angle);
        const arrowAngle = dir === 1 ? (angle + Math.PI) : angle;
        
        drawLine(ax - 18 * Math.cos(arrowAngle), ay - 18 * Math.sin(arrowAngle), 
                 ax + 18 * Math.cos(arrowAngle), ay + 18 * Math.sin(arrowAngle), color, 4);
        drawArrowHead(ax + 18 * Math.cos(arrowAngle), ay + 18 * Math.sin(arrowAngle), arrowAngle, color, 12);

        const reading = actualVals[i] * actualDirs[i] * dir; 

        ctx.fillStyle = '#0f172a'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`I${i+1} = ${reading}A`, cx + (len + 45) * Math.cos(angle), cy + (len + 45) * Math.sin(angle));
    });

    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('👆 请点击高亮的电流箭头翻转参考方向', cx, 45);
}

// ================== KVL 绘图 ==================
function drawKVL() {
    const cx = W / 2, cy = H / 2;
    const w = Math.min(W * 0.6, 450), h = Math.min(H * 0.5, 260);
    const L = cx - w/2, R = cx + w/2, T = cy - h/2, B = cy + h/2;

    drawLine(L, T, R, T, '#94a3b8', 4); 
    drawLine(R, T, R, B, '#94a3b8', 4); 
    drawLine(R, B, L, B, '#94a3b8', 4); 
    drawLine(L, B, L, T, '#94a3b8', 4); 

    drawResistor(cx, T, 90, 36, 'R1 = 2Ω');
    drawResistor(R, cy, 36, 90, 'R2 = 3Ω');
    drawSource(L, cy);

    const iDir = state.kvlCurrentDir;
    const iColor = '#ef4444'; 
    const iOffset = 16; 
    const aSize = 12;

    if (iDir === 1) { 
        drawLine(cx - 60, T + iOffset, cx - 30, T + iOffset, iColor, 4); drawArrowHead(cx - 30, T + iOffset, 0, iColor, aSize);
        drawLine(R - iOffset, cy - 60, R - iOffset, cy - 30, iColor, 4); drawArrowHead(R - iOffset, cy - 30, Math.PI/2, iColor, aSize);
        drawLine(cx + 60, B - iOffset, cx + 30, B - iOffset, iColor, 4); drawArrowHead(cx + 30, B - iOffset, Math.PI, iColor, aSize);
        drawLine(L + iOffset, cy + 60, L + iOffset, cy + 30, iColor, 4); drawArrowHead(L + iOffset, cy + 30, -Math.PI/2, iColor, aSize);
    } else { 
        drawLine(cx + 60, T + iOffset, cx + 30, T + iOffset, iColor, 4); drawArrowHead(cx + 30, T + iOffset, Math.PI, iColor, aSize);
        drawLine(L + iOffset, cy - 60, L + iOffset, cy - 30, iColor, 4); drawArrowHead(L + iOffset, cy - 30, Math.PI/2, iColor, aSize);
        drawLine(cx - 60, B - iOffset, cx - 30, B - iOffset, iColor, 4); drawArrowHead(cx - 30, B - iOffset, 0, iColor, aSize);
        drawLine(R - iOffset, cy + 60, R - iOffset, cy + 30, iColor, 4); drawArrowHead(R - iOffset, cy + 30, -Math.PI/2, iColor, aSize);
    }

    ctx.fillStyle = iColor; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`参考电流 i (${iDir === 1 ? '顺时针' : '逆时针'})`, cx, T - 35);

    const loopDir = state.kvlLoopDir;
    const loopColor = loopDir === 1 ? '#0ea5e9' : '#8b5cf6'; 
    ctx.beginPath();
    if (loopDir === 1) ctx.arc(cx, cy, 55, -Math.PI/2, Math.PI/2, false);
    else ctx.arc(cx, cy, 55, -Math.PI/2, Math.PI/2, true);
    ctx.strokeStyle = loopColor; ctx.lineWidth = 5; ctx.stroke();
    
    if (loopDir === 1) drawArrowHead(cx, cy + 55, 0, loopColor, 18);
    else drawArrowHead(cx, cy + 55, Math.PI, loopColor, 18);

    ctx.fillStyle = loopColor; ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`绕行 (${loopDir === 1 ? '顺时针' : '逆时针'})`, cx, cy + 95);

    ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`(已知物理实际：顺时针电流 2.4A)`, cx, B + 50);

    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('👇 请在右侧切换方向组合，并完成向导提问', cx, 45);
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    if (state.mode === 'kcl') drawKCL();
    else drawKVL();
    updateUI();
}

// ================== 交互与 KVL 向导 ==================
cv.addEventListener('click', e => {
    if (state.pendingAction || state.kvlStep !== 0) return;
    const rect = cv.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const cx = W / 2, cy = H / 2;

    if (state.mode === 'kcl') {
        const angle = Math.atan2(y - cy, x - cx);
        const angles = [Math.PI * 0.85, Math.PI * 1.85, Math.PI * 0.5];
        let minDiff = Infinity, idx = -1;
        angles.forEach((a, i) => {
            let diff = Math.abs(angle - a);
            if (diff > Math.PI) diff = 2 * Math.PI - diff;
            if (diff < minDiff) { minDiff = diff; idx = i; }
        });
        if (Math.hypot(x - cx, y - cy) > 20 && minDiff < 0.5) {
            triggerKCLPOE(idx);
        }
    }
});

function triggerKCLPOE(idx) {
    state.pendingAction = { type: 'kcl', idx };
    document.getElementById('kcl-eq').style.display = 'none';
    document.getElementById('kcl-poe').style.display = 'block';
    document.getElementById('kcl-poe-title').innerHTML = `你正准备翻转 <b>I${idx+1}</b> 的参考方向。<br><br>预测：翻转后，在方程中它前面的符号会发生反转吗？`;
    document.getElementById('kcl-poe-opts').innerHTML = `
        <button class="opt-btn" data-val="flip">会反转</button>
        <button class="opt-btn" data-val="same">保持不变</button>
    `;
}

function initKVLGuide() {
    state.kvlStep = 0;
    document.getElementById('kvl-step2').style.display = 'none';
    document.getElementById('kvl-eq').classList.remove('show');
    
    const step1 = document.getElementById('kvl-step1');
    step1.style.display = 'block';
    step1.style.borderColor = 'var(--amber)';
    
    const loopDir = state.kvlLoopDir;
    document.getElementById('kvl-step1-title').innerHTML = `Step 1: 你选择了【${loopDir === 1 ? '顺时针' : '逆时针'}】绕行。<br>经过左侧电源 Us 时，是电位升还是电位降？应记为正还是负？`;
    
    document.getElementById('kvl-step1-opts').innerHTML = `
        <button class="opt-btn" data-val="${loopDir === 1 ? 'neg' : 'pos'}">${loopDir === 1 ? '电位升，记 -12V' : '电位降，记 +12V'}</button>
        <button class="opt-btn" data-val="${loopDir === 1 ? 'pos' : 'neg'}">${loopDir === 1 ? '电位降，记 +12V' : '电位升，记 -12V'}</button>
    `;
    document.getElementById('kvl-step1-opts').dataset.correct = loopDir === 1 ? 'neg' : 'pos';
    
    document.getElementById('kvl-step1-opts').onclick = e => {
        const btn = e.target.closest('.opt-btn');
        if(!btn) return;
        const correct = document.getElementById('kvl-step1-opts').dataset.correct;
        if (btn.dataset.val === correct) {
            btn.classList.add('correct');
            setTimeout(() => {
                step1.style.borderColor = 'var(--green)';
                document.getElementById('kvl-step2').style.display = 'block';
                state.kvlStep = 1;
                showKVLStep2();
            }, 500);
        } else {
            btn.classList.add('wrong');
            setTimeout(() => btn.classList.remove('wrong'), 800);
        }
    };
}

function showKVLStep2() {
    const step2 = document.getElementById('kvl-step2');
    step2.style.borderColor = 'var(--amber)';
    
    const loopDir = state.kvlLoopDir;
    const iDir = state.kvlCurrentDir;
    const isSameDir = (loopDir === iDir);
    
    document.getElementById('kvl-step2-title').innerHTML = `Step 2: 沿着绕行方向经过电阻。<br>此时绕行方向与参考电流 i 的方向是相同还是相反？电阻项应该记正还是负？`;
    
    document.getElementById('kvl-step2-opts').innerHTML = `
        <button class="opt-btn" data-val="${isSameDir ? 'pos' : 'neg'}">${isSameDir ? '方向相同，记 +iR' : '方向相反，记 -iR'}</button>
        <button class="opt-btn" data-val="${isSameDir ? 'neg' : 'pos'}">${isSameDir ? '方向相反，记 -iR' : '方向相同，记 +iR'}</button>
    `;
    document.getElementById('kvl-step2-opts').dataset.correct = isSameDir ? 'pos' : 'neg';
    
    document.getElementById('kvl-step2-opts').onclick = e => {
        const btn = e.target.closest('.opt-btn');
        if(!btn) return;
        const correct = document.getElementById('kvl-step2-opts').dataset.correct;
        if (btn.dataset.val === correct) {
            btn.classList.add('correct');
            setTimeout(() => {
                step2.style.borderColor = 'var(--green)';
                state.kvlStep = 2;
                showKVLEquation();
            }, 500);
        } else {
            btn.classList.add('wrong');
            setTimeout(() => btn.classList.remove('wrong'), 800);
        }
    };
}

function showKVLEquation() {
    const eqBox = document.getElementById('kvl-eq');
    const loopDir = state.kvlLoopDir;
    const iDir = state.kvlCurrentDir;
    const isSameDir = (loopDir === iDir);
    
    const calcI = 2.4 * iDir;
    const usTerm = loopDir === 1 ? '-12' : '+12';
    const r1Term = isSameDir ? '+ 2i' : '- 2i';
    const r2Term = isSameDir ? '+ 3i' : '- 3i';
    let eqStr = `${usTerm} ${r1Term} ${r2Term} = 0`.replace(/\+\s+\-/g, '- ').replace(/\-\s+\-/g, '+ ');
    
    const c1 = 2 * calcI;
    const c2 = 3 * calcI;
    let r1Str = isSameDir ? `+ 2×(${calcI})` : `- 2×(${calcI})`;
    let r2Str = isSameDir ? `+ 3×(${calcI})` : `- 3×(${calcI})`;
    
    let calcStr = `${usTerm} ${r1Str} ${r2Str} = 0`.replace(/\+\s+\-/g, '- ').replace(/\-\s+\-/g, '+ ');
    calcStr += `<br>= ${usTerm} ${c1>=0?'+':' '}${c1} ${c2>=0?'+':' '}${c2} = 0`.replace(/\+\s+\-/g, '- ').replace(/\-\s+\-/g, '+ ');

    let totalRise, totalDrop;
    if (loopDir === 1) {
        totalRise = 12;
        totalDrop = 2.4 * 2 + 2.4 * 3;
    } else {
        totalRise = 2.4 * 2 + 2.4 * 3;
        totalDrop = 12;
    }

    eqBox.innerHTML = `
        <div style="margin-bottom:14px; font-size:20px; color:var(--green); font-weight:bold;">✅ 代数推导完成：</div>
        <b>变量方程:</b> ${eqStr}<br>
        <b>代入 i = ${calcI}A:</b><br>${calcStr}
        <div class="physics-conclusion">
            💡 物理本质：<br>
            总电压升 = ${totalRise.toFixed(1)} V<br>
            总电压降 = ${totalDrop.toFixed(1)} V<br>
            升与降完美平衡！
        </div>
    `;
    eqBox.classList.add('show');
}

function changeKvlCurrent(dir) {
    if (state.kvlCurrentDir === dir || state.pendingAction) return;
    state.kvlCurrentDir = dir;
    if(dir===1) state.explored.i_cw = true; else state.explored.i_ccw = true;
    
    document.getElementById('btn-i-cw').className = `btn-choice ${dir === 1 ? 'active' : ''} ${state.explored.i_cw ? 'tried' : ''}`;
    document.getElementById('btn-i-ccw').className = `btn-choice ${dir === -1 ? 'active' : ''} ${state.explored.i_ccw ? 'tried' : ''}`;
    draw();
    initKVLGuide();
}

function changeKvlLoop(dir) {
    if (state.kvlLoopDir === dir || state.pendingAction) return;
    state.kvlLoopDir = dir;
    if(dir===1) state.explored.loop_cw = true; else state.explored.loop_ccw = true;

    document.getElementById('btn-loop-cw').className = `btn-choice ${dir === 1 ? 'active' : ''} ${state.explored.loop_cw ? 'tried' : ''}`;
    document.getElementById('btn-loop-ccw').className = `btn-choice ${dir === -1 ? 'active' : ''} ${state.explored.loop_ccw ? 'tried' : ''}`;
    draw();
    initKVLGuide();
}

document.getElementById('kcl-poe-opts').onclick = e => {
    const btn = e.target.closest('.opt-btn');
    if (!btn) return;
    
    const isCorrect = (btn.dataset.val === 'flip');
    if (isCorrect) {
        btn.classList.add('correct');
        setTimeout(() => {
            state.kclDirs[state.pendingAction.idx] *= -1;
            state.kclFlips++;
            
            const dirs = state.kclDirs;
            let eqVars = [];
            let valTerms = [];
            
            for(let i=0; i<3; i++) {
                const sign = dirs[i] === 1 ? '+' : '-';
                eqVars.push(`${sign}I${i+1}`);
                
                const reading = actualVals[i] * actualDirs[i] * dirs[i];
                
                let term = '';
                if (i === 0) {
                    if (sign === '+') term += reading < 0 ? `(${reading})` : `${reading}`;
                    else term += reading < 0 ? `-(${reading})` : `-${reading}`;
                } else {
                    if (sign === '+') term += reading < 0 ? ` + (${reading})` : ` + ${reading}`;
                    else term += reading < 0 ? ` - (${reading})` : ` - ${reading}`;
                }
                valTerms.push(term);
            }
            
            let varsStr = eqVars.join(' ').replace(/^\+\s*/, '') + ' = 0';
            let valsStr = valTerms.join('') + ' = 0';
            
            const eqBox = document.getElementById('kcl-eq');
            eqBox.innerHTML = `
                <div style="margin-bottom:14px; font-size:18px; color:var(--muted); font-weight:bold;">规定：流入节点为正 (+)，流出节点为负 (-)</div>
                <b>变量方程:</b> ${varsStr}<br><br>
                <b>代入电表读数:</b> ${valsStr}<br><br>
                <div class="physics-conclusion">
                    💡 物理本质：<br>
                    无论参考方向怎么设，物理实际永远不变：<br>
                    <b>5A 的电流流入节点</b><br>
                    <b>5A 的电流流出节点</b><br>
                    流入与流出完美平衡（代数和恒为0）！
                </div>
            `;
            document.getElementById('kcl-poe').style.display = 'none';
            eqBox.style.display = 'block';
            state.pendingAction = null;
            draw();
        }, 400);
    } else {
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 800);
    }
};

function switchTab(mode) {
    if (state.pendingAction || state.kvlStep > 0) return;
    state.mode = mode;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    if (mode === 'kcl') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('panel-kcl').style.display = 'block';
        document.getElementById('panel-kvl').style.display = 'none';
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('panel-kcl').style.display = 'none';
        document.getElementById('panel-kvl').style.display = 'block';
        initKVLGuide();
    }
    draw();
}

function updateUI() {
    document.getElementById('m-kcl-flip').textContent = state.kclFlips > 0 ? '1 / 1' : '0 / 1';
    const expCount = Object.values(state.explored).filter(Boolean).length;
    document.getElementById('m-kvl-switch').textContent = expCount + ' / 4';
}

document.getElementById('btn-build').addEventListener('click', () => {
    const warnBox = document.getElementById('warn-box');
    const ta = document.getElementById('report-text');
    const expCount = Object.values(state.explored).filter(Boolean).length;

    if (state.kclFlips === 0 || expCount < 4) {
        ta.classList.remove('show');
        warnBox.innerHTML = '❌ 拦截：必须先翻转一次 KCL 箭头，且体验过 KVL 的所有4种方向组合！';
        warnBox.classList.add('show');
        return;
    }

    warnBox.classList.remove('show');
    const text = `【电路原理·基尔霍夫定律 学情数据】
- KCL 实验：已体验参考方向翻转。
- KVL 实验：已体验全部4种方向组合（电流顺/逆，绕行顺/逆）。
- 通关感悟：
  无论参考方向和绕行方向怎么变，KCL 永远满足“流入=流出”，KVL 永远满足“升压=降压”。方程符号的变化只是为了适应我们设定的正方向。
（请助教阅读以上操作记录，对我进行考核与追问）`;

    ta.value = text;
    ta.classList.add('show');
});

document.getElementById('btn-copy').addEventListener('click', async () => {
    const ta = document.getElementById('report-text');
    const warnBox = document.getElementById('warn-box');
    if (!ta.value) return;
    try {
        await navigator.clipboard.writeText(ta.value);
        warnBox.innerHTML = '✅ 已复制，去学习通粘贴给 AI 吧！';
        warnBox.classList.add('show');
        warnBox.style.background = 'var(--green)';
        setTimeout(() => {
            warnBox.classList.remove('show');
            warnBox.style.background = 'var(--pink)';
        }, 3000);
    } catch {
        ta.select();
        document.execCommand('copy');
    }
});

draw();
updateUI();
</script>
</body>
</html>
