<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>电路原理 · 交互演示合集</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px;
    background: #f1f5f9; color: #0f172a;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .container { width: min(800px, 100%); }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 8px; }
  .sub { color: #64748b; font-size: 15px; margin-bottom: 36px; }

  .grid { display: grid; gap: 16px; }
  .card {
    display: block; text-decoration: none;
    background: #fff; border-radius: 14px;
    padding: 22px 24px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 8px rgba(15,23,42,0.04);
    transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(15,23,42,0.08);
    border-color: #2563eb;
  }
  .card .info { flex: 1; }
  .card .title { font-size: 17px; font-weight: 650; color: #0f172a; margin-bottom: 4px; }
  .card .desc { font-size: 13.5px; color: #64748b; line-height: 1.5; }
  .card .arrow {
    font-size: 20px; color: #cbd5e1;
    transition: all 0.2s;
    margin-left: 18px;
  }
  .card:hover .arrow { color: #2563eb; transform: translateX(4px); }

  .footer {
    margin-top: 36px; text-align: center;
    font-size: 12.5px; color: #94a3b8;
  }
</style>
