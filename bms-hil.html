<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>BMS电池内阻与最大功率探究（虚实对比）</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif; background: #f4f7f6; text-align: center; padding: 15px 0 0 0; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; }
        
        h1 { color: #2c3e50; margin: 0 0 5px 0; font-size: 32px; letter-spacing: 2px;}
        .id-badge { background: #e74c3c; color: white; padding: 6px 20px; border-radius: 25px; font-size: 18px; display: inline-block; margin-bottom: 15px; font-weight: bold; box-shadow: 0 4px 10px rgba(231,76,60,0.3);}
        
        /* 顶部状态栏 */
        .status-bar { background: #fff; padding: 12px 30px; border-radius: 12px; display: inline-flex; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 20px; gap: 30px;}
        .data-box { font-size: 20px; font-weight: 600; color: #34495e;}
        .data-box span { font-weight: bold; color: #2980b9; font-size: 26px;}
        #connectBtn { padding: 12px 24px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; background: #3498db; color: white; transition: 0.2s; font-weight: bold;}
        #connectBtn:hover { background: #2980b9; transform: translateY(-2px);}

        /* 左右并排布局 */
        .split-container { display: flex; justify-content: center; gap: 20px; flex-wrap: nowrap; width: 100%; max-width: 1600px; padding: 0 15px; }
        .chart-panel { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); width: 780px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box;}
        .chart-panel h3 { margin: 0 0 10px 0; padding-bottom: 8px; border-bottom: 3px solid #eee; width: 100%; font-size: 24px;}
        
        /* 参数设置区 */
        .setup-box { background: #f8f9fa; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-around; width: 100%; box-sizing: border-box; font-size: 20px; border: 1px solid #e9ecef; font-weight: bold; color: #495057;}
        .setup-box input { width: 90px; padding: 6px; margin-left: 8px; border: 2px solid #ced4da; border-radius: 6px; outline: none; font-weight: bold; font-size: 20px; color: #2c3e50; text-align: center;}
        .setup-box input:focus { border-color: #3498db; }
        
        /* 画布（加大到 760x380） */
        canvas { background: #fff; border-radius: 8px; border: 1px solid #eee; width: 100%; height: auto; display: block;}
        
        /* 按钮 */
        .btn-group { margin-top: 12px; display: flex; gap: 15px; width: 100%; justify-content: center;}
        button.action-btn { padding: 12px 24px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; font-weight: bold;}
        .btn-new { background: #2ecc71; }
        .btn-old { background: #e74c3c; }
        .btn-clear { background: #95a5a6; }
        
        /* 图例 */
        .legend { margin-top: 10px; font-size: 18px; color: #495057; display: flex; justify-content: center; gap: 25px; font-weight: bold;}
        .legend-item { display: flex; align-items: center; }
        .legend-line { width: 40px; height: 0px; margin-right: 10px; border-top-width: 4px; border-top-style: solid; }
        .tips { color: #7f8c8d; font-size: 18px; margin-top: 20px; font-weight: 500; margin-bottom: 20px;}
    </style>
</head>
<body>

    <h1>🔋 BMS电池内阻与最大功率探究</h1>
    <div class="id-badge">专属防作弊ID: <span id="antiCheatID">生成中...</span></div>

    <div class="status-bar">
        <button id="connectBtn">🔌 连接 Arduino</button>
        <div class="data-box">实测电压: <span id="voltage">0.00</span> V</div>
        <div class="data-box">实测电流: <span id="current">0.00</span> mA</div>
        <div class="data-box">实测功率: <span id="power">0.00</span> mW</div>
    </div>

    <div class="split-container">
        <!-- 左侧 -->
        <div class="chart-panel" style="border-top: 8px solid #2ecc71;">
            <h3 style="color: #2ecc71;">🟢 新电池（健康状态）</h3>
            <div class="setup-box">
                <span>电压 V_th: <input type="number" id="vthNew" value="4.5" step="0.1"> V</span>
                <span>内阻 R_th: <input type="number" id="rthNew" value="51" step="1"> Ω</span>
            </div>
            <canvas id="canvasNew" width="760" height="380"></canvas>
            <div class="btn-group">
                <button class="action-btn btn-new" id="recordNewBtn">记录新电池数据</button>
                <button class="action-btn btn-clear" id="clearNewBtn">清空数据</button>
            </div>
            <div class="legend">
                <div class="legend-item"><div class="legend-line" style="border-top-color: #2ecc71; border-top-style: dashed;"></div> 理论完美虚线</div>
                <div class="legend-item"><div class="legend-line" style="border-top-color: #2ecc71; border-top-style: solid;"></div> 实测散点连线</div>
            </div>
        </div>

        <!-- 右侧 -->
        <div class="chart-panel" style="border-top: 8px solid #e74c3c;">
            <h3 style="color: #e74c3c;">🔴 旧电池（老化状态）</h3>
            <div class="setup-box">
                <span>电压 V_th: <input type="number" id="vthOld" value="4.0" step="0.1"> V</span>
                <span>内阻 R_th: <input type="number" id="rthOld" value="101" step="1"> Ω</span>
            </div>
            <canvas id="canvasOld" width="760" height="380"></canvas>
            <div class="btn-group">
                <button class="action-btn btn-old" id="recordOldBtn">记录旧电池数据</button>
                <button class="action-btn btn-clear" id="clearOldBtn">清空数据</button>
            </div>
            <div class="legend">
                <div class="legend-item"><div class="legend-line" style="border-top-color: #e74c3c; border-top-style: dashed;"></div> 理论完美虚线</div>
                <div class="legend-item"><div class="legend-line" style="border-top-color: #e74c3c; border-top-style: solid;"></div> 实测散点连线</div>
            </div>
        </div>
    </div>
    
    <div class="tips">💡 操作：换一次电阻，点击一次记录并输入阻值。理论完美虚线会与真实实测折线同屏对比。</div>

    <script>
        const randomID = 'STU-BMS-' + Math.floor(Math.random() * 9000 + 1000);
        document.getElementById('antiCheatID').textContent = randomID;

        let port, reader, isConnected = false;
        let newData = []; let oldData = [];

        // 绘图函数 (适配 760x380 尺寸)
        function drawChart(canvasId, Vth, Rth, data, color) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const width = canvas.width; const height = canvas.height;
            ctx.clearRect(0, 0, width, height);
            
            const maxR = 250; const maxP = 150; 
            const padLeft = 80, padBottom = 55, padTop = 25, padRight = 25;
            const drawW = width - padLeft - padRight;
            const drawH = height - padBottom - padTop;

            ctx.strokeStyle = '#888'; ctx.lineWidth = 3;
            ctx.beginPath(); 
            ctx.moveTo(padLeft, height - padBottom); ctx.lineTo(width - padRight, height - padBottom); 
            ctx.moveTo(padLeft, height - padBottom); ctx.lineTo(padLeft, padTop); 
            ctx.stroke();

            // 横坐标
            ctx.fillStyle = '#333'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
            for(let i = 0; i <= maxR; i += 50) {
                let x = padLeft + (i / maxR) * drawW;
                ctx.beginPath(); ctx.moveTo(x, height - padBottom); ctx.lineTo(x, height - padBottom + 8); ctx.stroke();
                ctx.fillText(i, x, height - padBottom + 30);
            }
            // 纵坐标
            ctx.textAlign = 'right';
            for(let i = 0; i <= maxP; i += 50) {
                let y = height - padBottom - (i / maxP) * drawH;
                ctx.beginPath(); ctx.moveTo(padLeft - 8, y); ctx.lineTo(padLeft, y); ctx.stroke();
                ctx.fillText(i, padLeft - 15, y + 7);
            }
            
            ctx.fillStyle = '#2c3e50'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'right';
            ctx.fillText('电阻 R (Ω)', width - padRight, height - padBottom + 45);
            ctx.textAlign = 'left';
            ctx.fillText('功率 P (mW)', padLeft - 70, padTop + 5);

            // 1. 理论曲线
            ctx.strokeStyle = color; ctx.setLineDash([10, 6]); ctx.lineWidth = 4;
            ctx.beginPath();
            for (let r = 0.1; r <= maxR; r += 0.1) {
                const p = Math.pow(Vth / (Rth + r), 2) * r * 1000;
                const x = padLeft + (r / maxR) * drawW;
                const y = height - padBottom - Math.min(p / maxP, 1) * drawH;
                if (r <= 0.2) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke(); ctx.setLineDash([]);

            // 2. 实测散点
            ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 5;
            data.forEach((point, index) => {
                const x = padLeft + (point.r / maxR) * drawW;
                const y = height - padBottom - Math.min(point.p / maxP, 1) * drawH;
                ctx.beginPath(); ctx.arc(x, y, 8, 0, 2 * Math.PI); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); 
                ctx.strokeStyle = color; ctx.lineWidth = 5; 
                if (index > 0) {
                    const prev = data[index - 1];
                    ctx.beginPath(); 
                    ctx.moveTo(padLeft + (prev.r / maxR) * drawW, height - padBottom - Math.min(prev.p / maxP, 1) * drawH);
                    ctx.lineTo(x, y); ctx.stroke();
                }
            });
        }

        function refreshAllCharts() {
            drawChart('canvasNew', parseFloat(document.getElementById('vthNew').value) || 4.5, parseFloat(document.getElementById('rthNew').value) || 51, newData, '#2ecc71');
            drawChart('canvasOld', parseFloat(document.getElementById('vthOld').value) || 4.0, parseFloat(document.getElementById('rthOld').value) || 101, oldData, '#e74c3c');
        }

        document.querySelectorAll('input').forEach(input => input.addEventListener('input', refreshAllCharts));

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                isConnected = true;
                document.getElementById('connectBtn').textContent = '✅ 已连接';
                document.getElementById('connectBtn').style.background = '#2ecc71';
                const textDecoder = new TextDecoderStream();
                port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        value.trim().split('\n').forEach(line => {
                            if (line) {
                                const parts = line.split(',');
                                if (parts.length === 3) {
                                    document.getElementById('voltage').textContent = parseFloat(parts[0]).toFixed(2);
                                    document.getElementById('current').textContent = parseFloat(parts[1]).toFixed(2);
                                    document.getElementById('power').textContent = parseFloat(parts[2]).toFixed(2);
                                }
                            }
                        });
                    }
                }
            } catch (err) { alert('连接失败：' + err); }
        });

        function recordData(dataArray) {
            if (!isConnected) return;
            const currentR = prompt("请输入当前的负载电阻值（Ω）：", "100");
            if (currentR) {
                const r = parseFloat(currentR);
                const p = parseFloat(document.getElementById('power').textContent);
                if (!isNaN(r) && !isNaN(p)) {
                    dataArray.push({ r: r, p: p });
                    dataArray.sort((a, b) => a.r - b.r);
                    refreshAllCharts();
                }
            }
        }

        document.getElementById('recordNewBtn').addEventListener('click', () => recordData(newData));
        document.getElementById('recordOldBtn').addEventListener('click', () => recordData(oldData));
        document.getElementById('clearNewBtn').addEventListener('click', () => { newData = []; refreshAllCharts(); });
        document.getElementById('clearOldBtn').addEventListener('click', () => { oldData = []; refreshAllCharts(); });

        refreshAllCharts();
    </script>
</body>
</html>
